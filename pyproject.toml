[project]
name = "42-agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rapoggi" },
    { name = "flinguen" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "termcolor>=3.3.0",
]

# [project.scripts]
# 42-agent-smith = "agent_smith:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_smith"

[tool.uv]
required-version = ">=0.13.9"

[tool.ruff]
line-length = 79

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
