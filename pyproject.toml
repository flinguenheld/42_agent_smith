[project]
name = "42-agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rapoggi" },
    { name = "flinguen" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.4",
    "rich>=15.0.0",
    "mcp[cli]>=1.26,<2",
]

[project.scripts]
# 42-agent-smith = "agent_smith:main"
sandbox = "agent_smith.sandbox.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agent_smith", "agent_mbpp"]

[tool.uv]
required-version = ">=0.13.9"

[tool.ruff]
line-length = 79

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "pytest>=9.1,<9.2",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
